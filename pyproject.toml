[project]
name = "financials"
version = "0.1.0"
description = "Local-first household financial planning and scenario tooling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
financials = "financials.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
